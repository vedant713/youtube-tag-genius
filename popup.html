<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Tag Generator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <h1>YT Tag Gen</h1>
      <p>Boost your video discovery</p>
    </header>

    <div class="input-group">
      <label for="keywordInput">Seed Keyword</label>
      <input type="text" id="keywordInput" placeholder="e.g., python tutorial">
    </div>

    <button id="generateBtn" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
        </path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      Generate Tags
    </button>

    <div class="tags-container" id="tagsContainer">
      <div class="tags-placeholder">
        Enter a keyword to generate tags
      </div>
    </div>

    <div class="tag-legend hidden" id="tagLegend">
      <div class="legend-item">
        <span class="legend-dot short"></span>
        <span>Core</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot medium"></span>
        <span>Phrases</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot long"></span>
        <span>Long-tail</span>
      </div>
    </div>

    <div class="actions hidden" id="actionButtons">
      <button id="searchBtn" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        Search on YouTube
      </button>
      <button id="copyBtn" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
