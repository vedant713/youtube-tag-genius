<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Tag Generator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <h1>YT Tag Gen</h1>
      <p>Boost your video discovery</p>
      <div class="shortcuts-hint">
        <kbd>Ctrl+A</kbd> Select all • <kbd>Ctrl+C</kbd> Copy • <kbd>Esc</kbd> Close
      </div>
    </header>

    <!-- Tab Navigation -->
    <div class="tab-navigation">
      <button class="tab-btn active" data-tab="generator">Tag Generator</button>
      <button class="tab-btn" data-tab="analyzer">Video Analyzer</button>
    </div>

    <!-- Tag Generator Tab -->
    <div class="tab-content active" id="generator-tab">
      <!-- Filters Section -->
      <details class="filters-section">
        <summary>⚙️ Filters</summary>
        <div class="filters-content">
          <div class="filter-group">
            <label>Language</label>
            <select id="langFilter">
              <option value="all">All Languages</option>
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Tag Length (characters)</label>
            <div class="range-display">
              <span id="minLengthVal">0</span> - <span id="maxLengthVal">50</span>
            </div>
            <input type="range" id="minLength" min="0" max="50" value="0">
            <input type="range" id="maxLength" min="0" max="50" value="50">
          </div>

          <div class="filter-group">
            <label>Exclude Words (comma-separated)</label>
            <input type="text" id="excludeWords" placeholder="e.g., how to, tutorial">
          </div>

          <div class="filter-group">
            <label>Max Tags: <span id="maxTagsVal">20</span></label>
            <input type="range" id="maxTags" min="5" max="50" value="20">
          </div>
        </div>
      </details>

      <div class="input-group">
        <label for="keywordInput">Seed Keyword</label>
        <input type="text" id="keywordInput" placeholder="e.g., python tutorial">
      </div>

      <button id="generateBtn" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
          </path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        Generate Tags
      </button>

      <div class="tags-container" id="tagsContainer">
        <div class="tags-placeholder">
          Enter a keyword to generate tags
        </div>
      </div>

      <div class="tag-legend hidden" id="tagLegend">
        <div class="legend-item">
          <span class="legend-dot short"></span>
          <span>Core</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot medium"></span>
          <span>Phrases</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot long"></span>
          <span>Long-tail</span>
        </div>
      </div>

      <div class="actions hidden" id="actionButtons">
        <button id="searchBtn" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Search on YouTube
        </button>
        <button id="copyBtn" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
      </div>
    </div>

    <!-- Video Analyzer Tab -->
    <div class="tab-content" id="analyzer-tab">
      <div class="analyzer-section">
        <div class="input-group">
          <label for="videoUrl">YouTube Video URL</label>
          <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
        </div>

        <button id="analyzeBtn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Analyze Video
        </button>

        <div id="analyzerResults" class="analyzer-results hidden">
          <div class="video-info">
            <h3 id="videoTitle">Video Title</h3>
            <p id="videoStats"></p>
          </div>

          <div class="tags-comparison">
            <div class="comparison-section">
              <h4>Video Tags</h4>
              <div id="videoTags" class="chips"></div>
            </div>

            <div class="comparison-section">
              <h4>Your Generated Tags</h4>
              <div id="yourTags" class="chips"></div>
            </div>

            <div class="comparison-section">
              <h4>Common Tags</h4>
              <div id="commonTags" class="chips"></div>
            </div>
          </div>

          <div class="insights">
            <h4>💡 Insights</h4>
            <ul id="insightsList"></ul>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>

</html>
